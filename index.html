            "text": "El precio del m3 de hormigón preparado en Puerto Montt varía según la resistencia especificada (H20, H25 o H30), el volumen cubicado y la distancia de transporte en camión mixer. En CONCREMONTT entregamos cotizaciones técnicas inmediatas vía WhatsApp con desglose de m3, servicio de bombeo y flete a obra."

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Para radieres residenciales y veredas peatonales se recomienda Hormigón H20 (200 kgf/cm²). Para galpones comerciales, accesos de vehículos y talleres se utiliza Hormigón H25 (250 kgf/cm²). Para losas de alto tonelaje, tránsito pesado o exposición salina se prescribe Hormigón H30 (300 kgf/cm²)."
          }
        },
        {
          "@type": "Question",

            "text": "Despachamos en camiones mixer de hasta 8 m3 en Puerto Montt, Puerto Varas, Alerce, Llanquihue y Frutillar. Se requiere acceso despejado para camión pesado (mínimo 3 metros de ancho) y ofrecemos servicio opcional de bomba pluma para radieres o terrenos alejados del paso del camión."
